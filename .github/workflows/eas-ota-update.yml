name: Dual-Channel EAS OTA Updates

on:
  push:
    branches:
      - main
      - preview
  workflow_dispatch:
    inputs:
      channel:
        description: 'OTA Channel to target (production, preview, or both)'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - preview
          - both

permissions:
  contents: write

jobs:
  ota-update:
    name: Publish Over-The-Air Update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --prefer-offline --no-audit

      - name: Determine Update Channel
        id: channel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "channel=${{ github.event.inputs.channel }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "channel=production" >> $GITHUB_OUTPUT
          else
            echo "channel=preview" >> $GITHUB_OUTPUT
          fi

      - name: Publish EAS OTA Update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            # Ensure EAS project is linked/initialized under account thulanesigasa0
            if ! grep -q "projectId" app.json; then
              echo "Initializing/linking EAS project under account thulanesigasa0..."
              npx --yes eas-cli init --account thulanesigasa0 --force --non-interactive
              if git diff --name-only | grep -q "app.json"; then
                echo "EAS project linked. Committing updated app.json back to repository..."
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git add app.json
                git commit -m "ci: link EAS project ID to app.json [skip ci]"
                git pull --rebase origin ${{ github.ref_name }} || true
                git push origin HEAD:${{ github.ref_name }} || true
              fi
            fi

            # Explicitly create and link dual branches and channels (production and preview)
            echo "Initializing EAS branches and channels..."
            npx --yes eas-cli branch:create production --non-interactive || true
            npx --yes eas-cli branch:create preview --non-interactive || true
            npx --yes eas-cli channel:create production --non-interactive || true
            npx --yes eas-cli channel:create preview --non-interactive || true
            npx --yes eas-cli channel:edit production --branch production --non-interactive || true
            npx --yes eas-cli channel:edit preview --branch preview --non-interactive || true

            echo "Current EAS Channels:"
            npx --yes eas-cli channel:list --non-interactive || true
            echo "Current EAS Branches:"
            npx --yes eas-cli branch:list --non-interactive || true

            TARGET_CHANNEL="${{ steps.channel.outputs.channel }}"
            echo "Publishing OTA update to channel(s): $TARGET_CHANNEL..."

            if [ "$TARGET_CHANNEL" = "both" ]; then
              npx --yes eas-cli update --branch production --message "OTA production update for commit ${{ github.sha }}" --non-interactive
              npx --yes eas-cli update --branch preview --message "OTA preview update for commit ${{ github.sha }}" --non-interactive
            else
              npx --yes eas-cli update --branch "$TARGET_CHANNEL" --message "OTA $TARGET_CHANNEL update for commit ${{ github.sha }}" --non-interactive
            fi
          else
            echo "EXPO_TOKEN not set in repository secrets; skipping EAS update publish."
          fi
