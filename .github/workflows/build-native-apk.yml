name: Compile Native Android APK & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK (GitHub Actions Runner)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & Accept Licenses
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --prefer-offline --no-audit

      - name: Inject Dynamic Version Code
        run: |
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.android = app.expo.android || {};
            app.expo.android.versionCode = ${{ github.run_number }};
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
          "

      - name: Prebuild Native Android Project
        run: npx expo prebuild --platform android --no-install

      - name: Compile Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x lint -x test --no-daemon
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dorg.gradle.parallel=false"

      - name: Rename APK Asset
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/*.apk build-output/morabaraba-v${APP_VERSION}-b${{ github.run_number }}.apk
          ls -la build-output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: morabaraba-android-apk
          path: build-output/*.apk
          retention-days: 14

      - name: Publish GitHub Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          RELEASE_TAG="v${APP_VERSION}-build${{ github.run_number }}"
          RELEASE_TITLE="Morabaraba v${APP_VERSION} (Build ${{ github.run_number }})"
          RELEASE_NOTES="Automated native Android release build v${APP_VERSION} compiled directly on GitHub Actions runner."

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Updating existing release $RELEASE_TAG..."
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes "$RELEASE_NOTES"
          else
            echo "Creating new release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes "$RELEASE_NOTES"
          fi

          echo "Uploading APK asset to release $RELEASE_TAG..."
          gh release upload "$RELEASE_TAG" build-output/*.apk --clobber
